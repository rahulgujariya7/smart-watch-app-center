<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Joke Generator</title>
  <style>
    :root {
      --background: #0f172a;
      --card: rgba(30, 41, 59, 0.92);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --primary: #8b5cf6;
      --primary-dark: #6d28d9;
      --border: rgba(148, 163, 184, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, .28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, .2), transparent 35%),
        var(--background);
    }

    .app { width: min(100%, 620px); }

    .card {
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }

    .emoji { font-size: 64px; line-height: 1; }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -1px;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .joke {
      min-height: 150px;
      display: grid;
      place-items: center;
      margin: 30px 0 24px;
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: #f5f3ff;
      font-size: clamp(1.2rem, 3vw, 1.55rem);
      line-height: 1.55;
      background: rgba(15, 23, 42, .8);
    }

    .joke.loading { color: var(--muted); font-size: 1rem; }
    .joke.error { color: #fecaca; font-size: 1rem; }

    button {
      width: 100%;
      padding: 16px 22px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 12px 28px rgba(109, 40, 217, .35);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:disabled { cursor: wait; opacity: .65; }

    .source {
      margin: 22px 0 0;
      color: #94a3b8;
      font-size: .82rem;
    }

    .source a { color: #c4b5fd; }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="title">
      <div class="emoji" aria-hidden="true">😂</div>
      <h1 id="title">Random Joke Generator</h1>
      <p class="subtitle">Need a quick laugh? Get a fresh joke from the internet.</p>

      <div id="joke" class="joke" role="status" aria-live="polite">
        Click the button to get a joke!
      </div>

      <button id="jokeButton" type="button">🎲 Tell me a joke</button>
      <p class="source">Powered by <a href="https://jokeapi.dev/" target="_blank" rel="noopener noreferrer">JokeAPI</a></p>
    </section>
  </main>

  <script>
    const jokeElement = document.getElementById("joke");
    const jokeButton = document.getElementById("jokeButton");
    const API_URL = "https://v2.jokeapi.dev/joke/Any?type=twopart,single&safe-mode";

    function showJoke(text, className = "") {
      jokeElement.className = `joke ${className}`.trim();
      jokeElement.textContent = text;
    }

    async function getRandomJoke() {
      jokeButton.disabled = true;
      jokeButton.textContent = "⏳ Finding a joke...";
      showJoke("Loading a fresh joke...", "loading");

      try {
        const response = await fetch(API_URL, { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error("The joke service is unavailable right now.");

        const data = await response.json();
        if (data.error) throw new Error(data.message || "The API returned an error.");

        const joke = data.type === "twopart"
          ? `${data.setup}\n\n${data.delivery}`
          : data.joke;

        showJoke(joke);
      } catch (error) {
        showJoke(`Sorry, we couldn't fetch a joke. ${error.message}`, "error");
      } finally {
        jokeButton.disabled = false;
        jokeButton.textContent = "🎲 Tell me another joke";
      }
    }

    jokeButton.addEventListener("click", getRandomJoke);
  </script>
</body>
</html>
